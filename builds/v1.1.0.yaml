version: 1.1.0
description: Build with defects planted on purpose. The gate must hold it.
seeded_defects:
  - id: SEED-01
    violates: NET-01
    behavior: ObstacleDistance is sent every 26 ms instead of 20 ms.
  - id: SEED-02
    violates: DIAG-04
    behavior: WriteDataByIdentifier is accepted in the default session.
  - id: SEED-03
    violates: SEC-01
    behavior: The attempt counter never locks access after wrong keys.
  - id: SEED-04
    violates: NET-02
    behavior: No timeout DTC is stored when VehicleSpeed stops.
  - id: SEED-05
    violates: SEC-03
    behavior: SecurityAccess returns the same seed on every request.
  - id: SEED-06
    violates: SEC-04
    behavior: ECUReset clears the failed-attempt counter.
  - id: SEED-07
    violates: SEC-05
    behavior: A diagnostic request longer than 16 bytes stops all responses.
