name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test suites on the reference build
        run: pytest -v --junitxml=reports/junit.xml
      - name: Gate on the reference build
        run: python -m gate.run builds/v1.0.0.yaml --out reports || test $? -eq 2
      - name: Gate on the seeded build
        run: python -m gate.run builds/v1.1.0.yaml --out reports || test $? -le 2
      - name: Publish gate reports
        if: always()
        run: cat reports/gate_*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: reports/
