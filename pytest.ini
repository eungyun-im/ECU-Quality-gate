[pytest]
pythonpath = .
testpaths = tests
addopts = --import-mode=importlib
markers =
    req(id): requirement the test verifies; feeds the gate
    diag: UDS diagnostic requirements
    network_behavior: bus timing and signal requirements
    security: access control and robustness requirements
    gate: runs the requirement suites against whole builds
    live: real-time run on a python-can bus
